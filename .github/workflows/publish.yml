name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    # Keep this ONLY if your npm Trusted Publisher config
    # also has Environment name = npm.
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check release tag matches package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"

          echo "package.json version: $PACKAGE_VERSION"
          echo "GitHub release tag: $GITHUB_REF_NAME"
          echo "Release version: $RELEASE_VERSION"

          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Error: GitHub release tag does not match package.json version."
            echo "Expected tag: v$PACKAGE_VERSION"
            echo "Actual tag:   $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Publish package
        run: |
          unset NODE_AUTH_TOKEN

          VERSION=$(node -p "require('./package.json').version")

          if [[ "$VERSION" == *-* ]]; then
            TAG="beta"
          else
            TAG="latest"
          fi

          echo "Publishing version $VERSION with npm tag $TAG"

          npm publish --access public --tag "$TAG" --provenance